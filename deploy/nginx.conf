# Paste this server block into Coolify's Custom Nginx configuration for the static site.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Revalidate HTML and CMS media after deployments; hashed build assets cache for a year.
    # CMS files are revalidated (cheap 304s via ETag) so a file removed in the CMS disappears after the next deployment.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 /404.html;

    location / {
        try_files $uri/index.html $uri =404;
    }

    location /en/ {
        try_files $uri/index.html $uri =404;
        error_page 404 /en/404/index.html;
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Preserve the former media endpoint's attachment handling for active/unknown formats.
    location ~ ^/media/.*\.(svg|bin)$ {
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

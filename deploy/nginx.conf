# Paste this server block into Coolify's Custom Nginx configuration for the static site.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Revalidate HTML after deployments. Hashed build assets and CMS files cache for a year:
    # the bytes behind a CMS asset ID never change, and a replaced file gets a new ID and URL.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 /404.html;

    location / {
        try_files $uri/index.html $uri =404;
    }

    location /en/ {
        try_files $uri/index.html $uri =404;
        error_page 404 /en/404/index.html;
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Preserve the former media endpoint's attachment handling for active/unknown formats.
    location ~ ^/media/.*\.(svg|bin)$ {
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
